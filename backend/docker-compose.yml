name: url_shortener_backend

services:
  db:
    image: postgres:16.4
    container_name: url_shortener_db
    restart: always
    env_file:
      - ./.env
    ports:
      - 5433:5432
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  web:
    container_name: url_shortener_web
    restart: always
    build: .
    volumes:
      - .:/app
    ports:
      - "8050:8050"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
