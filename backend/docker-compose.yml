name: url_shortener_backend

services:
  db:
    image: postgres:16.4
    container_name: url_shortener_db
    restart: always
    env_file:
      - ./.env
    ports:
      - 5432:5432
    volumes:
      - .data:/var/lib/postgresql

  web:
    container_name: url_shortener_web
    restart: always
    build: .
    volumes:
      - .:/app
    ports:
      - "8050:8050"
    env_file:
      - ./.env
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8050/ || exit 1"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
